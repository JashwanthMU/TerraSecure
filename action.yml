name: 'TerraSecure'
description: 'Multi-cloud AI-powered Terraform security scanner for AWS, Azure, and GCP'
author: 'JashwanthMU'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to Terraform files or directory to scan'
    required: false
    default: '.'
  format:
    description: 'Output format: text, json, or sarif'
    required: false
    default: 'sarif'
  fail-on:
    description: 'Severity level that causes the action to fail: critical, high, medium, or any'
    required: false
    default: 'critical'
  cloud:
    description: 'Comma-separated list of clouds to scan: aws,azure,gcp. Leave empty to scan all detected clouds.'
    required: false
    default: ''
  output:
    description: 'Output file path for scan results'
    required: false
    default: 'terrasecure-results.sarif'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file'
    value: ${{ steps.scan.outputs.sarif-file }}
  issues-found:
    description: 'Total number of issues found'
    value: ${{ steps.scan.outputs.issues-found }}
  critical-count:
    description: 'Number of CRITICAL severity issues found'
    value: ${{ steps.scan.outputs.critical-count }}
  cloud-breakdown:
    description: 'JSON object of issue counts per cloud, e.g. {"aws":3,"azure":1}'
    value: ${{ steps.scan.outputs.cloud-breakdown }}

runs:
  using: 'composite'
  steps:
    - name: Build Docker image
      shell: bash
      run: docker build -t terrasecure-action:latest "${{ github.action_path }}"

    - name: Run TerraSecure scan
      id: scan
      shell: bash
      run: |
        set +e

        CLOUD_ARGS=()
        if [ -n "${{ inputs.cloud }}" ]; then
          CLOUD_ARGS=(--cloud "${{ inputs.cloud }}")
        fi

        # Primary requested-format output (usually SARIF for the
        # Security tab).
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          terrasecure-action:latest \
          "${{ inputs.path }}" \
          --format "${{ inputs.format }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --output "${{ inputs.output }}" \
          "${CLOUD_ARGS[@]}"
        SCAN_EXIT=$?

        # Also generate a JSON report internally so we can populate
        # the action's outputs (issue counts, cloud breakdown)
        # regardless of what --format the user asked for.
        docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          terrasecure-action:latest \
          "${{ inputs.path }}" \
          --format json \
          --fail-on any \
          --output terrasecure-summary.json \
          "${CLOUD_ARGS[@]}" > /dev/null 2>&1

        if [ -f "terrasecure-summary.json" ]; then
          ISSUES=$(python3 -c "import json; d=json.load(open('terrasecure-summary.json')); print(len(d.get('issues', [])))")
          CRITICAL=$(python3 -c "import json; d=json.load(open('terrasecure-summary.json')); print(d.get('stats', {}).get('CRITICAL', 0))")
          BREAKDOWN=$(python3 -c "import json; d=json.load(open('terrasecure-summary.json')); print(json.dumps(d.get('cloud_breakdown', {})))")
        else
          ISSUES=0
          CRITICAL=0
          BREAKDOWN='{}'
        fi

        echo "sarif-file=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        echo "issues-found=$ISSUES" >> "$GITHUB_OUTPUT"
        echo "critical-count=$CRITICAL" >> "$GITHUB_OUTPUT"
        echo "cloud-breakdown=$BREAKDOWN" >> "$GITHUB_OUTPUT"

        exit $SCAN_EXIT